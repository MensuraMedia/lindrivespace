[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lindrivespace"
version = "0.2.0"
description = "Native GTK3 disk-space explorer for Linux Mint: mounts, partitions, folder and file sizes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
license-files = ["LICENSE.md"]
authors = [{ name = "MensuraMedia" }]
dependencies = [
  "PyGObject>=3.42",
  "pycairo>=1.20",
  "psutil>=5.9",
  "pyudev>=0.24",
]

[project.scripts]
lindrivespace = "lindrivespace.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "debian", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N802"]  # GTK virtual methods are do_activate / do_open etc.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["lindrivespace.core"]
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
