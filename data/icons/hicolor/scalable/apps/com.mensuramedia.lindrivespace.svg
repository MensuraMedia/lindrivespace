<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- LinDriveSpace: dark tile, Ubuntu-orange usage ring, drive glyph (gray-temperature palette) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b414f"/>
      <stop offset="1" stop-color="#262a35"/>
    </linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#d9dbe0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#555c6c" stroke-width="1"/>
  <!-- usage ring: track + 68 % arc -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#1b1e29" stroke-width="7"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#e95420" stroke-width="7"
          stroke-dasharray="89.7 132" stroke-linecap="round" transform="rotate(-90 32 32)"/>
  <!-- drive glyph -->
  <rect x="22" y="26" width="20" height="12" rx="2.5" fill="url(#drive)"/>
  <rect x="24.5" y="28.5" width="11" height="1.6" rx="0.8" fill="#8a90a0"/>
  <rect x="24.5" y="31.6" width="8" height="1.6" rx="0.8" fill="#8a90a0"/>
  <circle cx="38.6" cy="34.6" r="1.4" fill="#e95420"/>
</svg>
